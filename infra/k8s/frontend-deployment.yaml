apiVersion: apps/v1
kind: Deployment
metadata:
  name: globaltask-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: globaltask-frontend
  template:
    metadata:
      labels:
        app: globaltask-frontend
    spec:
      containers:
      - name: frontend
        image: globaltask-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: globaltask-frontend-service
spec:
  selector:
    app: globaltask-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
